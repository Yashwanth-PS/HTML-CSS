<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Item-Level-Grids-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .container {
            margin: 20px;
            padding: 10px;
            border: 2px solid #333;
            height: 600px;
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            grid-template-rows: repeat(3, 1fr);
            /* Short Hand 
            grid-template: 200px 200px 200px / 1fr minmax(100px, 2fr) 1fr; */
            row-gap: 10px;
            column-gap: 10px;
            /* Short Hand for row-gap and column-gap
            gap: 10px 10px; */
        }
        .item {
            background-color: lightblue;
            border: 1px solid black;
        }
        .item-2 {
            overflow: scroll;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1"></div>
        <div class="item item-2"></div>
        <div class="item item-3"></div>
    </div>
</body>
</html>
