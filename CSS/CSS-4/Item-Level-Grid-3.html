<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Item-Level-Grids-3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .container {
            margin: 20px;
            padding: 10px;
            border: 2px solid #333;
            height: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: repeat(5, 1fr);
            /* Short Hand 
            grid-template: 200px 200px 200px / 1fr minmax(100px, 2fr) 1fr; */
            row-gap: 10px;
            column-gap: 10px;
            /* Short Hand for row-gap and column-gap
            gap: 10px 10px; */
            /* grid-auto-flow: column; */
        }
        .item {
            background-color: lightblue;
            border: 1px solid black;
        }
        .item-1 {
            overflow: scroll;
            grid-row-start: 1;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
            background-color: lightcoral;
        }
        .item-2 {
            overflow: scroll;
            grid-row: 2 / 4;
            grid-column: 3 / 4;
            background-color: lightblue;
        }
        .item-3 {
            overflow: scroll;
            grid-row-start: -4;
            grid-row-end: -1;
            grid-column-start: -4;
            grid-column-end: -2;
            background-color: lightgreen;
            z-index: 1;
        }
        .item-4 {
            overflow: scroll;
            grid-row: 1 / 2;
            grid-column: span 3; /* Follows the Normal Flow */
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
    </div>
</body>
</html>
