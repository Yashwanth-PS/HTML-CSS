<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex-Box</title>
    <style>
        h1 {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: underline;
        }
        .container {
            height: 150px;
            margin: 50px;
            padding: 10px;
            background: lightblue;
            border: 2px solid black;
            border-radius: 4px;
            display: flex;
            /* flex-direction: row;
            flex-wrap: wrap; */
            /* Short hand for above two properties */
            flex-flow: row wrap; 
            overflow: scroll;
            justify-content: center;
        }
        .box {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            border-radius: 4px;
            background-color: red;
            margin-bottom: 20px;
            margin-left: 10px;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            box-sizing: border-box;
        }
        .box:last-of-type{
            margin-bottom: 0px;
        }
        /* .box:first-of-type {
            margin-left: 0px;
        } */
    </style>
</head>
<body>
    <h1>CSS Flex Box</h1>
    <div class="container">
        <div class="box" style="order: 4;">1</div>
        <div class="box" style="order: 3;">2</div>
        <div class="box" style="order: 2;">3</div>
        <div class="box" style="order: 1;">4</div>
    </div>
</body>
</html>
