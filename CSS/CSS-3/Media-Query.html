<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        .box {
            width: 100%;
            height: 100px;
            border: 2px solid black;
            border-radius: 4px;
            margin: 10px;
            background-color: red;
        } 
        /* Media Query for devices with screen width 600px and below */
        @media (max-width: 600px) {
            .box {
                background-color: green;
            }
        }
        /* Media Query for devices with screen width 900px and above */
        @media (min-width: 900px) {
            .box {
                background-color: blue;
            }
        }
        /* Media Query for devices with screen width more than 700px and less than 800px */
        @media (min-width: 700px) and (max-width: 800px) {
            .box {
                background-color: yellow;
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Design Example</h1>
    <p>Responsiveness using Media Query</p>
    <div class="box"></div>
</body>
</html>
