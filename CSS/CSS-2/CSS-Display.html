<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display</title>
    <style>
        p {
            display: inline;
            width: 100px;
            height: 100px;
            border: 2px, solid, red
        }
        span {
            display: block;
            width: 100px;
            height: 100px;
            border: 2px, solid, blue
        }
        img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <p>Paragraph Tag 1</p>
    <p>Paragraph Tag 2</p> 
    <span>Span Tag 1</span>
    <span>Span Tag 2</span>
    <img src="https://images.pexels.com/photos/25637444/pexels-photo-25637444/free-photo-of-open-front-hood-of-a-ford-mustang-boss-302.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
    <a href="">Click Me</a>
</body>
</html>
